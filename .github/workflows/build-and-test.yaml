name: Build and Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'maven'

      - name: Verify Spring-boot app
        run: ./mvnw clean verify
        working-directory: ./app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./ui/package-lock.json

      - name: Build and test React/Next.js UI
        run: npm ci && npm run build && npm run test
        working-directory: ./ui

      - name: Upload JaCoCo coverage to CodeCov
        uses: codecov/codecov-action@v5
        with:
          files: ./app/target/site/jacoco/jacoco.xml
          flags: app
          name: Spring-boot App
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload lcov coverage to CodeCov
        uses: codecov/codecov-action@v5
        with:
          files: ./ui/coverage/lcov.info
          flags: ui
          name: React/Next.js UI
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
